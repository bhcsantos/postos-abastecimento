<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4fa8">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Posto · Postos de Abastecimento</title>
<meta name="description" content="Combustíveis, preços, horário e serviços de um posto de abastecimento, com dados da DGEG.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Inter:wght@500;600&display=swap">
<style>
/* Layout: ficha do posto; cabeçalho com marca e ações, preços em tabela, depois horário/serviços ao lado do mapa */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#14202e; --muted:#5b6878; --line:#d9dfe7;
  --accent:#1f4fa8; --accent-soft:#e3ebf8; --sel:#e8a317; --good:#1d7a46; --bad:#b3261e; --mapfilter:none;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1520; --surface:#172030; --fg:#e7edf5; --muted:#9aa8b9; --line:#2a3647;
  --accent:#7fa8ec; --accent-soft:#1f2e48; --sel:#f0b43a; --good:#5cc98a; --bad:#f2847b;
  --mapfilter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.back{color:var(--accent);font-weight:600;text-decoration:none;font-size:.92rem;justify-self:start}
.back:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.brand{font-family:var(--display);font-weight:700;font-size:.95rem;color:#fff;border-radius:6px;padding:6px 10px;letter-spacing:.04em;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
h1{font-family:var(--display);font-size:2.1rem;line-height:1.05;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.addr{color:var(--muted);margin:4px 0 0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);background:var(--surface)}
.badge.open{border-color:var(--good);color:var(--good)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.on{background:var(--sel);border-color:var(--sel);color:#1a1300}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
h2{font-family:var(--display);font-size:1.35rem;margin:0 0 10px}
.discbtn{font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer}
.discbtn[aria-pressed="true"]{border-color:var(--good);color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.disc{display:block;font-size:.8rem;color:var(--good);margin-top:3px}
.price .pump{display:block;font-size:.72rem;color:var(--muted);font-family:var(--body);text-decoration:line-through}
dialog.dlg{border:1px solid var(--line);border-radius:12px;padding:0;max-width:min(560px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.dlg::backdrop{background:rgba(10,16,26,.55)}
.dlgbox{padding:18px 20px;display:grid;gap:12px;max-height:80vh;overflow:auto}
.dlgbox h2{font-family:var(--display);font-size:1.5rem;margin:0}
.dlgsub{margin:0;color:var(--muted);font-size:.88rem}
.dlgbox fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;gap:6px;margin:0}
.dlgbox legend{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px}
.opt{display:flex;gap:10px;align-items:center;cursor:pointer}
.opt input{width:18px;height:18px}
.rules summary{cursor:pointer;color:var(--accent);font-weight:600}
.rule{border-top:1px solid var(--line);padding:8px 0;font-size:.88rem}
.rule a{color:var(--accent)}
.rule .st{font-size:.7rem;border-radius:999px;padding:1px 8px;margin-left:4px}
.rule .st.ok{background:var(--good);color:#fff}.rule .st.warn{background:#d97a00;color:#fff}
.dlgact{display:flex;gap:8px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.price{font-size:1.1rem;font-weight:500}
.cheaper,small.mut.cheaper{color:var(--good)} .dearer,small.mut.dearer{color:var(--bad)}
td.num small.cheaper,td.num small.dearer{display:block;white-space:normal;max-width:24ch;margin-left:auto;line-height:1.3;font-family:var(--body)}
td:first-child{min-width:9ch}
@media (max-width:640px){
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:auto}
  .tablewrap thead{display:none}
  .tablewrap tr{border-bottom:1px solid var(--line);padding:8px 0}
  .tablewrap td{border:0;padding:3px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:right}
  .tablewrap td:first-child{font-weight:600;padding-bottom:6px}
  .tablewrap td[data-l]:not(:first-child)::before{content:attr(data-l);font-family:var(--body);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;flex:none}
  .tablewrap td.num>*{text-align:right}
  .tablewrap td.num{flex-wrap:wrap}
  .tablewrap td.num small.cheaper,.tablewrap td.num small.dearer{max-width:none;flex-basis:100%}
}
small.mut{color:var(--muted);font-family:var(--body);font-size:.75rem;display:block}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dt{color:var(--muted)} dd{margin:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--bg)}
.sub{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
#map{height:300px;border-radius:6px}
.tab{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 4px;background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hist svg{width:100%;height:auto;display:block}
.hist .ax{font:11px var(--mono);fill:var(--muted)}
.hist .grid line{stroke:var(--line)}
.histleg{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.histleg i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.leaflet-tile-pane{filter:var(--mapfilter)}
.note{font-size:.82rem;color:var(--muted)}
.note a{color:var(--accent)}
.err{color:var(--bad)}
.skel{color:var(--muted)}
</style>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Voltar à lista de postos</a>
  <div id="content"><p class="skel">A carregar a ficha do posto…</p></div>
  <footer style="display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;padding-top:8px;border-top:1px solid var(--line);font-size:.88rem"><a href="conta.html#ideas" style="color:var(--accent);font-weight:600;text-decoration:none">Pedir uma funcionalidade</a><a href="conta.html" style="color:var(--accent);font-weight:600;text-decoration:none">A minha conta</a><a href="privacidade.html" style="color:var(--accent);font-weight:600;text-decoration:none">Privacidade</a></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="descontos.js"></script>
<script src="route.js"></script>
<script type="module" src="account.js"></script>
<script>
const API="https://precoscombustiveis.dgeg.gov.pt/api/PrecoComb";
const FUEL_ID={"Gasóleo simples":2101,"Gasóleo especial":2105,"Gasóleo colorido":2150,"Biodiesel B15":2115,"Gasolina simples 95":3201,"Gasolina especial 95":3205,"Gasolina 98":3400,"Gasolina especial 98":3405,"GPL Auto":1120,"GNC (gás natural comprimido) - €/kg":1143,"GNC (gás natural comprimido) - €/m3":1141,"GNL (gás natural liquefeito) - €/kg":1142};
const DISTRITOS={"Aveiro":1,"Beja":2,"Braga":3,"Bragança":4,"Castelo Branco":5,"Coimbra":6,"Évora":7,"Faro":8,"Guarda":9,"Leiria":10,"Lisboa":11,"Portalegre":12,"Porto":13,"Santarém":14,"Setúbal":15,"Viana do Castelo":16,"Vila Real":17,"Viseu":18};
const BRAND_COLORS={"GALP":"#e2591d","BP":"#0b8a3a","REPSOL":"#c99a00","PRIO":"#2f6db5","CEPSA":"#b8202e","MOEVE":"#00857c","SHELL":"#d8a400","AUCHAN":"#d6001c","REDE ENERGIA":"#6a4fb3","INTERMARCHÉ":"#c4161c","ALVES BANDEIRA":"#1b3f8b","FREITAS":"#7a3e9d","PINGO DOCE":"#4c8c2b","OZ Energia":"#0098c7","Genérico":"#6f7b8a"};
const PALETTE=["#8a5a2b","#2b7a8a","#8a2b6e","#5a8a2b","#3d4f9e","#9e6a3d","#3d9e7f","#9e3d4f"];
function colorOf(b){if(BRAND_COLORS[b])return BRAND_COLORS[b];let h=0;for(const c of b)h=(h*31+c.charCodeAt(0))|0;return PALETTE[Math.abs(h)%PALETTE.length]}

/* Identificação dos combustíveis: forma da norma EN 16942 (círculo = gasolina, quadrado = gasóleo, losango = gás) e a cor habitual em Portugal (verde = gasolina, preto = gasóleo) */
const FUEL_STYLE={
  "Gasóleo simples":{c:"#1d1f23",s:"sq",t:"D"},
  "Gasóleo especial":{c:"#1d1f23",s:"sq",t:"D+",ring:"#e0b400"},
  "Gasóleo colorido":{c:"#7a2f8f",s:"sq",t:"D"},
  "Biodiesel B15":{c:"#1d1f23",s:"sq",t:"B15"},
  "Gasolina simples 95":{c:"#2e9e4f",s:"ci",t:"95"},"Gasolina 95 simples":{c:"#2e9e4f",s:"ci",t:"95"},
  "Gasolina especial 95":{c:"#1d7a3c",s:"ci",t:"95+",ring:"#e0b400"},"Gasolina 95 especial":{c:"#1d7a3c",s:"ci",t:"95+",ring:"#e0b400"},
  "Gasolina 98":{c:"#0f5a2c",s:"ci",t:"98"},
  "Gasolina especial 98":{c:"#0f5a2c",s:"ci",t:"98+",ring:"#e0b400"},"Gasolina 98 especial":{c:"#0f5a2c",s:"ci",t:"98+",ring:"#e0b400"},
  "GPL Auto":{c:"#1f6fb5",s:"di",t:"GPL"}
};
function fuelBadge(name,size=26){
  const f=FUEL_STYLE[name]||(/gas[óo]leo|diesel/i.test(name)?{c:"#1d1f23",s:"sq",t:"D"}:/gasolina/i.test(name)?{c:"#2e9e4f",s:"ci",t:"G"}:{c:"#1f6fb5",s:"di",t:"Gás"});
  const ring=f.ring?`stroke="${f.ring}" stroke-width="2.5"`:`stroke="#fff" stroke-opacity=".55" stroke-width="1"`;
  const shape=f.s==="ci"?`<circle cx="16" cy="16" r="14" fill="${f.c}" ${ring}/>`:f.s==="sq"?`<rect x="2.5" y="2.5" width="27" height="27" rx="3" fill="${f.c}" ${ring}/>`:`<path d="M16 1.5 30.5 16 16 30.5 1.5 16Z" fill="${f.c}" ${ring}/>`;
  const fs=f.t.length>=3?9.5:f.t.length===2?12:14;
  return `<svg class="fb" viewBox="0 0 32 32" width="${size}" height="${size}" aria-hidden="true">${shape}<text x="16" y="16" dy=".35em" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="${fs}" fill="#fff">${f.t}</text></svg>`;
}
const fuelColor=name=>(FUEL_STYLE[name]||{c:"#1f4fa8"}).c;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=p=>parseFloat(String(p).replace(/[^\d,.-]/g,"").replace(",","."));
const eur=v=>v.toFixed(3).replace(".",",")+" €";
const cents=v=>(v>0?"+":"")+(v*100).toFixed(1).replace(".",",")+" cênt.";
const fmtDate=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})/.exec(d||"");return m?`${m[3]}/${m[2]}/${m[1]} ${m[4]}`:esc(d)};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);

const id=+new URLSearchParams(location.search).get("id");
/* Pedido com limite de tempo: se o servidor não responder em 15 s, tenta mais uma vez e depois desiste (em vez de ficar "A carregar…" para sempre) */
async function fetchT(u,o={},ms=15000,tries=2){for(let i=0;;i++){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{...o,signal:c.signal});clearTimeout(t);return r}catch(e){clearTimeout(t);if(i+1>=tries)throw e}}}
async function getJSON(u){const r=await fetchT(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);const j=await r.json();if(!j.status)throw new Error(j.mensagem||"erro");return j.resultado}
/* Ficha: primeiro pelo Worker (cache de 15 min e cópia de reserva), senão diretamente à DGEG */
async function getPosto(){
  let p=null;
  try{const r=await fetchT(`https://mobie-proxy.bhcsantos.workers.dev/dgeg/GetDadosPosto?id=${id}`,{},10000,1);if(r.ok){const j=await r.json();if(j.status)p=j.resultado}}catch(e){}
  if(!p)p=await getJSON(`${API}/GetDadosPosto?id=${id}`);
  if(/^cepsa$/i.test(String(p.Marca||"").trim()))p.Marca="MOEVE"; // Cepsa = Moeve
  return p;
}
/* Cópia no telemóvel das últimas 30 fichas abertas: mostra-se logo e atualiza-se por trás */
const PLS="pp-p1:";
function savePosto(){try{localStorage.setItem(PLS+id,JSON.stringify({p:P,t:PT}));const idx=(JSON.parse(localStorage.getItem(PLS+"idx")||"[]")).filter(x=>x!==id);idx.unshift(id);idx.slice(30).forEach(x=>localStorage.removeItem(PLS+x));localStorage.setItem(PLS+"idx",JSON.stringify(idx.slice(0,30)))}catch(e){}}
function loadSaved(){try{return JSON.parse(localStorage.getItem(PLS+id))}catch(e){return null}}
let PT=0, pstat="";
const hm=t=>`${new Date(t).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})} de ${new Date(t).toLocaleDateString("pt-PT")}`;
function updStat(){const el=$("pstat");if(el){el.textContent=pstat;el.hidden=!pstat}}
async function refreshPosto(){
  try{const p=await getPosto();const mudou=JSON.stringify(p)!==JSON.stringify(P);P=p;PT=Date.now();savePosto();pstat="";
    if(mudou){const y=scrollY;await main();scrollTo(0,y)}else updStat()}
  catch(e){pstat=`Não foi possível atualizar: a mostrar a ficha guardada às ${hm(PT)}.`;updStat()}
}

let P=null; // ficha já obtida: ao mudar os cartões, volta a desenhar sem pedir de novo à DGEG
async function main(){
  const dl=Promise.race([Discounts.load(),new Promise(r=>setTimeout(r,8000))]); // os descontos não podem atrasar a ficha
  if(!id){$("content").innerHTML=`<p class="err">Falta o número do posto no endereço. Volte à lista e escolha um posto.</p>`;return}
  if(!P){
    const saved=loadSaved();
    if(saved&&saved.p){P=saved.p;PT=saved.t;pstat=`A mostrar a ficha guardada às ${hm(PT)}; a atualizar os preços…`;await dl;setTimeout(refreshPosto,0)}
    else try{[P]=await Promise.all([getPosto(),dl]);PT=Date.now();savePosto()}
  catch(e){$("content").innerHTML=`<p class="err">A DGEG não respondeu a tempo e não foi possível obter a ficha deste posto. <button type="button" class="btn" onclick="location.reload()">Tentar de novo</button></p>`;return}
  }
  const p=P;
  const m=p.Morada||{}, lat=+m.Latitude, lon=+m.Longitude;
  document.title=`${p.Nome} · Postos de Abastecimento`;
  const h=p.HorarioPosto||{};
  const always=["DiasUteis","Sabado","Domingo","Feriado"].every(k=>/24 horas/i.test(h[k]||""));
  const fuels=(p.Combustiveis||[]).map(c=>({name:c.TipoCombustivel,price:num(c.Preco),date:c.DataAtualizacao})).filter(c=>isFinite(c.price));
  const sv=`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`;
  const gmView=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${p.Marca} ${m.Morada}, ${m.CodPostal} ${m.Localidade||""}`)}`;
  const gmGo=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`;
  const extra=v=>v&&v!=="-"&&String(v).trim();

  $("content").innerHTML=`
  <div style="display:grid;gap:16px">
    <p id="pstat" style="margin:0;font-size:.8rem;color:var(--muted)"${pstat?"":" hidden"}>${esc(pstat)}</p>
    ${(()=>{const last=fuels.map(c=>String(c.date||"")).sort().pop()||"";return last&&Date.now()-new Date(last.replace(" ","T"))>10*864e5?`<p style="margin:0;padding:8px 12px;border-radius:8px;background:#fff4e5;color:#8a4500;font-size:.88rem">⚠ Este posto não atualiza os preços na DGEG desde ${esc(last.slice(0,10).split("-").reverse().join("/"))}. Por isso a DGEG deixou de o mostrar na pesquisa. Os preços abaixo podem já não ser os do posto: confirme no local.</p>`:""})()}
    <div class="head">
      <span class="brand" style="background:${colorOf(p.Marca||"")}" title="${esc(p.Marca)}">${esc(p.Marca||"Sem marca")}</span>
      <div>
        <h1>${esc(p.Nome)}</h1>
        <p class="addr">${esc(m.Morada)} · ${esc(m.CodPostal)} ${esc(m.Localidade)}${m.Municipio?" · concelho de "+esc(m.Municipio):""}${m.Distrito?" · distrito de "+esc(m.Distrito):""}</p>
        <div class="badges">
          ${always?`<span class="badge open">Aberto 24 horas</span>`:""}
          ${p.Utilizacao?`<span class="badge">Utilização ${esc(p.Utilizacao).toLowerCase()}</span>`:""}
          ${m.Sentido?`<span class="badge">Sentido ${esc(m.Sentido)}</span>`:""}
          <span class="badge">${fuels.length} ${fuels.length===1?"combustível":"combustíveis"}</span>
        </div>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="${gmGo}" target="_blank" rel="noopener">Navegar até aqui ↗</a>
      <a class="btn ghost" href="${gmView}" target="_blank" rel="noopener">Ver no Google Maps ↗</a>
      <a class="btn ghost" href="${sv}" target="_blank" rel="noopener">Ver fotos no Street View ↗</a>
      <button type="button" class="btn ghost" id="selbtn"></button>
      <button type="button" class="btn ghost" id="favbtn">☆ Guardar nos favoritos</button>
    </div>

    <section class="card">
      <h2>Combustíveis e preços</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Combustível</th><th class="num">Preço por litro</th><th class="num">Com os seus descontos</th><th class="num">Média no concelho</th><th class="num">Posição no concelho</th><th>Atualizado</th></tr></thead>
        <tbody>${fuels.map((c,i)=>`<tr><td data-l="Combustível"><span style="display:inline-flex;align-items:center;gap:8px">${fuelBadge(c.name,26)}${esc(c.name)}</span></td><td data-l="Preço por litro" class="num price">${eur(c.price)}</td><td data-l="Com os seus descontos" class="num">${(()=>{const a=Discounts.apply(p.Marca,c.name,c.price);return a.regras.length?`${eur(a.final)}<small class="mut cheaper">${Discounts.resumo(a)}${a.saldo?` · custo real ${eur(a.efetivo)}`:""}</small>`:`<span class="skel">—</span>`})()}</td><td data-l="Média no concelho" class="num" id="avg${i}"><span class="skel">…</span></td><td data-l="Posição no concelho" class="num" id="rank${i}"><span class="skel">…</span></td><td data-l="Atualizado">${fmtDate(c.date)}</td></tr>`).join("")
          || `<tr><td colspan="6">Este posto não tem preços publicados.</td></tr>`}</tbody>
      </table></div>
      ${(()=>{
        /* O seu desconto, explicado por combustível (os que têm as mesmas regras ficam juntos) */
        const g=new Map();fuels.forEach(c=>{const a=Discounts.apply(p.Marca,c.name,c.price);if(!a.regras.length)return;const k=a.regras.map(r=>r.id).join();if(!g.has(k))g.set(k,{a,names:[]});g.get(k).names.push(c.name)});
        const mine=[...g.values()].map(x=>`<details class="discd" style="margin:10px 0 0"${g.size===1?" open":""}><summary>O seu desconto${g.size>1?` em ${esc(x.names.join(", "))}`:""}: ${Discounts.describe(x.a)}</summary>${Discounts.explain(x.a)}</details>`).join("");
        /* Como poupar mais: para o combustível que usa (o escolhido na página principal), ou o primeiro */
        const pref=Object.keys(FUEL_ID).find(n=>FUEL_ID[n]===+store.get("pp-fuel",0)&&fuels.some(c=>c.name===n));
        const f=fuels.find(c=>c.name===pref)||fuels.find(c=>/gas[óo]leo simples/i.test(c.name))||fuels[0];
        const more=f?Discounts.renderMais(p.Marca,f.name,f.price):"";
        return mine+(more?`<details class="discd" style="margin:10px 0 0" open><summary>Como poupar mais neste posto (${esc(f.name)})</summary>${more}</details>`:"");
      })()}
      <p class="note" style="margin:10px 0 0"><button type="button" class="discbtn" id="discBtn" style="margin-bottom:8px"></button><br>A média e a posição comparam com os postos do mesmo concelho que vendem esse combustível (1.º = o mais barato).</p>
    </section>

    <section class="card">
      <h2>Avisar-me quando o preço baixar</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:end">
        <label style="display:grid;gap:4px;font-weight:600;font-size:.9rem">Combustível<select id="alFuel" style="font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">${fuels.map(c=>`<option value="${esc(c.name)}">${esc(c.name)} (agora ${eur(c.price)})</option>`).join("")}</select></label>
        <label style="display:grid;gap:4px;font-weight:600;font-size:.9rem">Abaixo de (€/litro)<input id="alVal" type="number" step="0.001" min="0.5" max="4" style="font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:9em"></label>
        <button type="button" class="btn" id="alBtn">Criar alerta</button>
      </div>
      <p class="note" id="alMsg" style="margin:0">Precisa de ter sessão iniciada. Os alertas ficam na sua conta.</p>
    </section>

    <section class="card">
      <h2>Evolução do preço</h2>
      <div class="chips" id="histTabs" role="tablist"></div>
      <div id="histChart" style="margin-top:10px"><p class="skel">A carregar o histórico…</p></div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Horário</h2>
        <dl>
          <dt>Dias úteis</dt><dd>${esc(h.DiasUteis||"Sem informação")}</dd>
          <dt>Sábado</dt><dd>${esc(h.Sabado||"Sem informação")}</dd>
          <dt>Domingo</dt><dd>${esc(h.Domingo||"Sem informação")}</dd>
          <dt>Feriados</dt><dd>${esc(h.Feriado||"Sem informação")}</dd>
        </dl>
        <div class="sub">Serviços</div>
        <div class="chips">${(p.Servicos||[]).map(s=>`<span class="chip">${esc(s.Descritivo)}</span>`).join("")||`<span class="note">Sem serviços indicados.</span>`}</div>
        <div class="sub">Meios de pagamento</div>
        <div class="chips">${(p.MeiosPagamento||[]).map(s=>`<span class="chip">${esc(s.Descritivo)}</span>`).join("")||`<span class="note">Sem meios de pagamento indicados.</span>`}</div>
        ${extra(p.OutrosServicos)?`<div class="sub">Outros serviços</div><p style="margin:0">${esc(p.OutrosServicos)}</p>`:""}
        ${extra(p.Observacoes)?`<div class="sub">Observações</div><p style="margin:0">${esc(p.Observacoes)}</p>`:""}
      </section>
      <section class="card">
        <h2>Localização</h2>
        <div id="map" role="region" aria-label="Mapa do posto"></div>
        <p class="note" style="margin:8px 0 0">Coordenadas <span style="font-family:var(--mono)">${lat.toFixed(5)}, ${lon.toFixed(5)}</span>. A DGEG não publica fotografias dos postos; o botão Street View abre as imagens da rua no Google Maps.</p>
      </section>
    </div>
    <p class="note">Fonte: <a href="https://precoscombustiveis.dgeg.gov.pt/" target="_blank" rel="noopener">DGEG, Preços dos Combustíveis</a>, consultado agora. Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores do OpenStreetMap</a>.</p>
  </div>`;

  Discounts.renderButton(); $("discBtn").onclick=()=>Discounts.openPanel(); Discounts.onchange=()=>{const y=scrollY;main().then(()=>scrollTo(0,y))};
  /* Mapa */
  if(isFinite(lat)&&isFinite(lon)){
    const map=L.map("map",{scrollWheelZoom:false}).setView([lat,lon],16);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    L.circleMarker([lat,lon],{radius:10,color:"#fff",weight:3,fillColor:colorOf(p.Marca||""),fillOpacity:1}).addTo(map).bindTooltip(`<strong>${esc(p.Marca)}</strong> · ${esc(p.Nome)}`);
  }

  /* Adicionar à seleção da página principal */
  const stop={k:"fuel",id,t:p.Nome,b:p.Marca,sub:[m.Morada,m.CodPostal,m.Localidade,m.Municipio].filter(Boolean).join(", "),lat,lng:lon,
    info:fuels[0]?`${fuels[0].name} ${eur(fuels[0].price)}`:""};
  const updSel=()=>{const on=Route.has("fuel",id);$("selbtn").textContent=on?"✓ No meu percurso (remover)":"Adicionar ao meu percurso";$("selbtn").classList.toggle("on",on)};
  $("selbtn").onclick=()=>{Route.toggle(stop);updSel()};
  updSel();

  /* Favoritos e alertas (precisam de conta) */
  const favItem={k:"fuel",id,t:p.Nome,sub:[p.Marca,m.Morada,m.Localidade].filter(Boolean).join(" · "),lat,lng:lon};
  const updFav=()=>{const on=!!window.Account?.isFav("fuel",id);$("favbtn").textContent=on?"★ Nos favoritos (retirar)":"☆ Guardar nos favoritos";$("favbtn").classList.toggle("on",on)};
  $("favbtn").onclick=()=>{if(!window.Account?.user){location.href="conta.html?voltar="+encodeURIComponent("posto.html?id="+id);return}Account.toggleFav(favItem);updFav()};
  const setAlVal=()=>{const c=fuels.find(x=>x.name===$("alFuel").value);const ex=(window.Account?.data?.alertas||[]).find(x=>x.posto===id&&x.combustivel===$("alFuel").value);$("alVal").value=ex?ex.limite:(c?(c.price-0.05).toFixed(3):"")};
  if(fuels.length){$("alFuel").onchange=setAlVal;setAlVal()}
  $("alBtn").onclick=()=>{
    if(!window.Account?.user){location.href="conta.html?voltar="+encodeURIComponent("posto.html?id="+id);return}
    const v=parseFloat(String($("alVal").value).replace(",","."));if(!(v>0)){$("alMsg").textContent="Escreva o preço abaixo do qual quer ser avisado.";return}
    const name=$("alFuel").value;Account.setAlert({posto:id,nome:p.Nome,combustivel:name,fuelId:HIST_ID[name]||"",limite:+v.toFixed(3)});
    $("alMsg").textContent=`Alerta guardado: avisamos quando ${name} baixar de ${v.toFixed(3).replace(".",",")} €. Veja e gira os alertas em "A minha conta".`};
  const acctUpd=()=>{updFav();if(window.Account?.user)$("alMsg").textContent=$("alMsg").textContent.startsWith("Precisa")?"Os alertas ficam na sua conta. Veja e gira-os em \"A minha conta\".":$("alMsg").textContent};
  window.onProfile=acctUpd; updFav();

  /* Histórico (guardado todos os dias pelo GitHub Actions a partir da DGEG) */
  loadHistory(id,p,m,fuels);

  /* Comparação com o concelho */
  const did=DISTRITOS[m.Distrito];
  await Promise.all(fuels.map(async(c,i)=>{
    const fid=FUEL_ID[c.name];
    try{
      if(!fid||!did)throw 0;
      const rows=(await getJSON(`${API}/PesquisarPostos?idsTiposComb=${fid}&idDistrito=${did}&qtdPorPagina=5000&pagina=1`)||[])
        .filter(r=>r.Municipio===m.Municipio).map(r=>num(r.Preco)).filter(isFinite);
      if(!rows.length)throw 0;
      const avg=rows.reduce((a,b)=>a+b,0)/rows.length, d=c.price-avg;
      const rank=rows.filter(v=>v<c.price-0.0005).length+1;
      $("avg"+i).innerHTML=`${eur(avg)}<small class="mut ${d<-0.0005?"cheaper":d>0.0005?"dearer":""}">${Math.abs(d)<0.0005?"igual à média":cents(d)+" face à média"}</small>`;
      $("rank"+i).innerHTML=`${rank}.º de ${rows.length}`;
    }catch(e){$("avg"+i).textContent="—";$("rank"+i).textContent="—"}
  }));
}
const HIST_ID={"Gasóleo simples":"2101","Gasóleo especial":"2105","Gasolina simples 95":"3201","Gasolina especial 95":"3205","Gasolina especial 98":"3405","GPL Auto":"1120"};
async function loadHistory(id,p,m,fuels){
  const box=$("histChart");
  let shard=null,medias=null;
  try{[shard,medias]=await Promise.all([fetch(`data/historico/${String(id%64).padStart(2,"0")}.json`).then(r=>r.ok?r.json():null),fetch("data/historico/medias.json").then(r=>r.ok?r.json():null)])}catch(e){}
  const mine=shard&&shard[String(id)]||{};
  const opts=fuels.filter(c=>HIST_ID[c.name]&&mine[HIST_ID[c.name]]);
  if(!opts.length){box.innerHTML=`<p class="note">Ainda não há histórico para este posto. O site guarda os preços todos os dias desde 25/11/2026.</p>`;return}
  let cur=opts[0].name;
  const draw=()=>{
    $("histTabs").innerHTML=opts.map(c=>`<button type="button" class="tab" role="tab" aria-selected="${c.name===cur}" data-f="${esc(c.name)}">${fuelBadge(c.name,20)}${esc(c.name)}</button>`).join("");
    $("histTabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.f;draw()});
    const fid=HIST_ID[cur], st=mine[fid]||[], dist=(medias&&medias[fid]&&medias[fid][m.Distrito])||[], nat=(medias&&medias[fid]&&medias[fid]["Portugal"])||[];
    const series=[{n:"Este posto",c:"var(--accent)",w:3,pts:st.map(([d,v])=>[d,v])},{n:`Mediana do distrito ${m.Distrito?"("+esc(m.Distrito)+")":""}`,c:"#d97a00",w:2,dash:"6 4",pts:dist.map(e=>[e[0],e[2]])},{n:"Mediana nacional",c:"var(--muted)",w:2,dash:"2 4",pts:nat.map(e=>[e[0],e[2]])}].filter(s=>s.pts.length);
    const days=[...new Set(series.flatMap(s=>s.pts.map(x=>x[0])))].sort();
    const vals=series.flatMap(s=>s.pts.map(x=>x[1]));
    let lo=Math.min(...vals),hi=Math.max(...vals); if(hi-lo<0.02){lo-=0.01;hi+=0.01}
    const pad=(hi-lo)*0.1; lo-=pad; hi+=pad;
    const W=720,H=240,L=58,R=12,T=12,B=28, x=d=>days.length<2?L+(W-L-R)/2:L+(days.indexOf(d)/(days.length-1))*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
    const ticks=[0,1,2,3,4].map(i=>lo+(hi-lo)*i/4);
    const fmtD=d=>d.slice(8,10)+"/"+d.slice(5,7);
    const xt=days.length<=6?days:[0,.25,.5,.75,1].map(f=>days[Math.round(f*(days.length-1))]);
    box.innerHTML=`<div class="hist"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do preço de ${esc(cur)}">
      <g class="grid">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>
      ${ticks.map(v=>`<text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v.toFixed(3).replace(".",",")}</text>`).join("")}
      ${[...new Set(xt)].map(d=>`<text class="ax" x="${x(d)}" y="${H-8}" text-anchor="middle">${fmtD(d)}</text>`).join("")}
      ${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w}" ${s.dash?`stroke-dasharray="${s.dash}"`:""} stroke-linejoin="round" points="${s.pts.map(([d,v])=>`${x(d)},${y(v)}`).join(" ")}"/>${s.pts.length<3?s.pts.map(([d,v])=>`<circle cx="${x(d)}" cy="${y(v)}" r="4" fill="${s.c}"/>`).join(""):""}`).join("")}
      ${st.length?`<circle cx="${x(st[st.length-1][0])}" cy="${y(st[st.length-1][1])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:""}
    </svg></div>
    <div class="histleg">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join("")}</div>
    <p class="note" style="margin:6px 0 0">${days.length<7?`O site guarda os preços todos os dias desde 25/11/2026; o gráfico ganha forma ao longo das próximas semanas.`:`Preço registado uma vez por dia, de ${fmtD(days[0])} a ${fmtD(days[days.length-1])}.`}</p>`;
  };
  draw();
}

main();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
