name: Previsão semanal de preços
on:
  schedule:
    - cron: "17 8-20/2 * * 5"   # sexta, de 2 em 2 horas (08:17 a 20:17 UTC): a estimativa sai e pode ser revista
    - cron: "17 9,18 * * 6,0"   # sábado e domingo, 2 vezes por dia
    - cron: "17 7 * * 1"        # segunda de manhã: previsão final da semana que começa
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  previsao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/previsao.py
      - name: Gravar no repositório
        run: |
          git config user.name "previsao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previsao.json
          git diff --cached --quiet && exit 0
          git commit -m "Previsão de preços: $(date -u +%F)"
          git pull --rebase --autostash
          git push
