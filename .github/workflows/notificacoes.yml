name: Avisos (email e push)
on:
  schedule:
    - cron: "11,41 * * * *"   # a cada 30 minutos
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: notificacoes
  cancel-in-progress: false
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install firebase-admin pywebpush
      - name: Enviar avisos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notificacoes.py
      - name: Gravar a chave pública das notificações (se mudou)
        run: |
          git config user.name "avisos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Notificações push: chave pública"
          git pull --rebase --autostash
          git push
